<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 150 70" role="img" aria-label="Drop and Pair">
	<!--
		Standalone copy of the header wordmark, for use outside the theme. The header
		inlines the same drawing so the car and letters can use currentColor.
	-->
	<style>
		.ink { fill: #1a1a1a; }
		@media (prefers-color-scheme: dark) { .ink { fill: #f6f4ee; } }
		text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 800; }
	</style>
	<g class="ink">
		<text x="0" y="58" textLength="64" lengthAdjust="spacingAndGlyphs">drop</text>
		<text x="71" y="58" textLength="21" lengthAdjust="spacingAndGlyphs" opacity=".55">&amp;</text>
		<text x="98" y="58" textLength="52" lengthAdjust="spacingAndGlyphs">pair</text>
	</g>
	<path
		d="M1.3 31H4Q6.5 31 8.6 29.7L37 11.3Q45.5 5.8 52.5 12.6Q55.5 15.6 63 26.2Q67 31.5 75 31.5H148.7"
		fill="none"
		stroke="#e8563f"
		stroke-width="2.6"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<g class="ink">
		<rect x="40.1" y="1.4" width="10" height="4.6" rx="1.6" />
		<circle cx="42.4" cy="6.5" r="1.15" />
		<circle cx="47.8" cy="6.5" r="1.15" />
	</g>
</svg>
